name: Build and Push Hermes Gateway Image

on:
    push:
        branches:
            - main
        paths:
            - 'hermes-runtime/**'
            - 'k8s/hermes-**'
            - 'k8s/hermes/**'
            - 'k8s/deploy.sh'
            - 'k8s/tests/**'
            - '.github/workflows/build-hermes-gateway.yml'
    pull_request:
        branches:
            - main
        paths:
            - 'hermes-runtime/**'
            - 'k8s/hermes-**'
            - 'k8s/hermes/**'
            - 'k8s/deploy.sh'
            - 'k8s/tests/**'
            - '.github/workflows/build-hermes-gateway.yml'
    workflow_dispatch:

concurrency:
    group: build-hermes-gateway-${{ github.ref }}
    cancel-in-progress: true

env:
    IMAGE_NAME: ghcr.io/jc01rho/hermes-gateway
    IMAGE_TAG: ${{ github.sha }}

jobs:
    build-test-scan-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Install offline test dependencies
              run: python -m pip install --disable-pip-version-check pytest==8.3.5 PyYAML==6.0.2

            - name: Run offline runtime and deployment tests
              run: python -m pytest hermes-runtime/tests/offline k8s/tests -v

            - name: Build immutable commit image
              if: github.event_name != 'pull_request'
              run: docker build --pull --file hermes-runtime/Dockerfile --tag "${IMAGE_NAME}:${IMAGE_TAG}" hermes-runtime

            - name: Verify image command
              if: github.event_name != 'pull_request'
              run: |
                  test "$(docker image inspect --format '{{json .Config.Entrypoint}}' "${IMAGE_NAME}:${IMAGE_TAG}")" = '["hermes"]'
                  test "$(docker image inspect --format '{{json .Config.Cmd}}' "${IMAGE_NAME}:${IMAGE_TAG}")" = '["gateway","run"]'

            - name: Scan image vulnerabilities and secrets
              if: github.event_name != 'pull_request'
              uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # v0.36.0
              with:
                  image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
                  scanners: vuln,secret
                  severity: HIGH,CRITICAL
                  ignore-unfixed: true
                  exit-code: '1'
                  format: table


            - name: Log in to GitHub Container Registry
              if: github.event_name != 'pull_request'
              uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Push immutable commit image
              if: github.event_name != 'pull_request'
              run: docker push "${IMAGE_NAME}:${IMAGE_TAG}"

            - name: Generate canonical Hermes gateway receipt
              if: github.event_name != 'pull_request'
              env:
                  RECEIPT_REPOSITORY: ${{ github.repository }}
                  RECEIPT_RUN_ID: ${{ github.run_id }}
                  RECEIPT_RUN_ATTEMPT: ${{ github.run_attempt }}
                  RECEIPT_EVENT: ${{ github.event_name }}
                  RECEIPT_REF: ${{ github.ref }}
                  RECEIPT_HEAD_SHA: ${{ github.sha }}
              run: |
                  docker pull "${IMAGE_NAME}:${IMAGE_TAG}"
                  DIGEST_REF="$(docker image inspect --format '{{index .RepoDigests 0}}' "${IMAGE_NAME}:${IMAGE_TAG}")"
                  IMAGE_REPOSITORY="${DIGEST_REF%@*}"
                  DIGEST="${DIGEST_REF#*@}"
                  test "$IMAGE_REPOSITORY" = 'ghcr.io/jc01rho/hermes-gateway'
                  [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
                  export RECEIPT_DIGEST="$DIGEST"
                  export RECEIPT_SUBJECT="${IMAGE_REPOSITORY}@${DIGEST}"
                  python3 - <<'PY'
                  import json
                  import os
                  from pathlib import Path

                  receipt = {
                      "schema_version": 1,
                      "repository": os.environ["RECEIPT_REPOSITORY"],
                      "workflow_path": ".github/workflows/build-hermes-gateway.yml",
                      "run_id": int(os.environ["RECEIPT_RUN_ID"]),
                      "run_attempt": int(os.environ["RECEIPT_RUN_ATTEMPT"]),
                      "run_url": f"https://github.com/jc01rho/skald/actions/runs/{os.environ['RECEIPT_RUN_ID']}/attempts/{os.environ['RECEIPT_RUN_ATTEMPT']}",
                      "event": os.environ["RECEIPT_EVENT"],
                      "ref": os.environ["RECEIPT_REF"],
                      "head_sha": os.environ["RECEIPT_HEAD_SHA"],
                      "conclusion": "success",
                      "image_repository": "ghcr.io/jc01rho/hermes-gateway",
                      "digest": os.environ["RECEIPT_DIGEST"],
                      "subject": os.environ["RECEIPT_SUBJECT"],
                  }
                  assert receipt["repository"] == "jc01rho/skald"
                  assert receipt["event"] in {"push", "workflow_dispatch"}
                  assert receipt["ref"] == "refs/heads/main"
                  assert len(receipt["head_sha"]) == 40 and all(c in "0123456789abcdef" for c in receipt["head_sha"])
                  Path("hermes-gateway-receipt.json").write_text(
                      json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n",
                      encoding="utf-8",
                  )
                  PY
                  printf 'Hermes image: `%s`\n' "$RECEIPT_SUBJECT" >> "$GITHUB_STEP_SUMMARY"

            - name: Upload Hermes gateway receipt
              if: github.event_name != 'pull_request'
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: hermes-gateway-receipt-${{ github.run_id }}-${{ github.run_attempt }}
                  path: hermes-gateway-receipt.json
                  if-no-files-found: error
                  compression-level: 0
                  retention-days: 30
                  overwrite: false
                  include-hidden-files: false