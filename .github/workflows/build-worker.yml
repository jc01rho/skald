name: Build and Push Worker Docker Image

on:
    push:
        branches:
            - main
        tags:
            - 'v*'
    pull_request:
        branches:
            - main

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ghcr.io/jc01rho/skald-worker

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Debug - Check source field in docs_collector.py
              run: |
                  echo "=== Git SHA ===" 
                  git rev-parse HEAD
                  echo "=== Source field in docs_collector.py ===" 
                  grep -n "source=" worker/src/skald_worker/collectors/docs_collector.py | head -10

            - name: Log in to GitHub Container Registry
              run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            - name: Build Docker image (no buildx, no cache)
              run: |
                  cd worker
                  docker build --no-cache --pull -t ${{ env.IMAGE_NAME }}:latest -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
                  echo "=== Verify built image has correct code ==="
                  docker run --rm ${{ env.IMAGE_NAME }}:latest grep -n "source=" /app/src/skald_worker/collectors/docs_collector.py | head -10

            - name: Push Docker image
              run: |
                  docker push ${{ env.IMAGE_NAME }}:latest
                  docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
