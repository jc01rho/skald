apiVersion: v1
kind: ConfigMap
metadata:
    name: skald-worker-config
    namespace: skald
    labels:
        app: skald-worker
data:
    # Skald API Configuration
    SKALD_BASE_URL: 'http://api-service:8000'
    SKALD_PROJECT_ID: '83dabf13-0c3e-41f0-8f6b-75a817cd1e25'

    # Jira Configuration
    JIRA_JQL_FILTER: 'TYPE IN (인시던트, 장애) AND updated >= -1d ORDER BY updated DESC'
    JIRA_POLL_INTERVAL_MINUTES: '10'
    JIRA_ENABLED: 'true'
    JIRA_URL: ''

    # Docs Configuration
    DOCS_POLL_INTERVAL_MINUTES: '30'
    DOCS_ENABLED: 'true'

    # Worker Configuration
    WORKER_CONCURRENCY: '4'
    LOG_LEVEL: 'INFO'
    LOG_FORMAT: 'json'

    # Server Configuration
    HOST: '0.0.0.0'
    PORT: '8080'
