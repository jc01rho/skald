[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skald-worker"
version = "0.1.0"
description = "Skald data collection worker - Jira issues and technical docs collector with RAG endpoints"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Skald Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "jira>=3.10.0",
    "apscheduler>=3.10.0",
    "beautifulsoup4>=4.12.0",
    "structlog>=24.0.0",
    "tenacity>=9.0.0",
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.35.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/skald_worker"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
