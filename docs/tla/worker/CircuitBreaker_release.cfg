\* Bug run 3: release collector burns all circuit waits with sleep(0) while a
\* half-open probe is in flight. FIX_LOCK=TRUE isolates this from the lock bug.
CONSTANTS
    Callers = {c1, c2}
    FailureThreshold = 2
    SuccessThreshold = 2
    MaxWaits = 2
    WITH_RELEASE = TRUE
    FIX_LOCK = TRUE
    FIX_RELEASE_WAIT = FALSE
INIT Init
NEXT Next
INVARIANTS TypeOK RelNoInstantBurn
