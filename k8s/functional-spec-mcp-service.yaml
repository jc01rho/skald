apiVersion: v1
kind: Service
metadata:
  name: functional-spec-mcp
  namespace: skald
  labels:
    app: skald
    component: functional-spec-mcp
    environment: production
spec:
  type: ClusterIP
  selector:
    app: skald
    component: functional-spec-mcp
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
