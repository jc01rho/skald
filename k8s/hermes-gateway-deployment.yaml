apiVersion: apps/v1
kind: Deployment
metadata:
    name: hermes-gateway
    namespace: skald
    labels:
        app: skald
        component: hermes-gateway
spec:
    replicas: 1
    strategy:
        type: Recreate
    selector:
        matchLabels:
            component: hermes-gateway
    template:
        metadata:
            annotations:
                skald.io/hermes-config-revision: 'functional-spec-v6'
            labels:
                app: skald
                component: hermes-gateway
        spec:
            automountServiceAccountToken: false
            imagePullSecrets:
                - name: ghcr-pull-secret
            securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
                fsGroup: 10001
                seccompProfile:
                    type: RuntimeDefault
            initContainers:
                - name: sparrow-function-spec
                  image: HERMES_IMAGE
                  imagePullPolicy: IfNotPresent
                  env:
                      - name: GIT_CONFIG_COUNT
                        value: "1"
                      - name: GIT_CONFIG_KEY_0
                        value: safe.directory
                      - name: GIT_CONFIG_VALUE_0
                        value: /opt/sparrow-function-spec
                  command:
                      - /bin/bash
                      - -ec
                  args:
                      - |
                        find /opt/sparrow-function-spec -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
                        git -c http.sslVerify=false clone https://gitlab.git.sparrow.local/mcp-servers/functional-spec.git /opt/sparrow-function-spec
                        git -C /opt/sparrow-function-spec checkout --detach c4b6941b4b7bfb054040960099616019a901e745
                        test "$(git -C /opt/sparrow-function-spec rev-parse HEAD)" = "c4b6941b4b7bfb054040960099616019a901e745"
                        cd /opt/sparrow-function-spec
                        bun install --frozen-lockfile
                  securityContext:
                      runAsNonRoot: true
                      runAsUser: 10001
                      runAsGroup: 10001
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: false
                      capabilities:
                          drop:
                              - ALL
                  volumeMounts:
                      - name: sparrow-function-spec
                        mountPath: /opt/sparrow-function-spec
            containers:
                - name: hermes-gateway
                  image: HERMES_IMAGE
                  imagePullPolicy: IfNotPresent
                  command: ['hermes']
                  args: ['gateway', 'run']
                  stdin: false
                  tty: false
                  env:
                      - name: DISCORD_BOT_TOKEN
                        valueFrom:
                            secretKeyRef:
                                name: hermes-gateway-secrets
                                key: DISCORD_BOT_TOKEN
                      - name: OPENAI_API_KEY
                        valueFrom:
                            secretKeyRef:
                                name: hermes-gateway-secrets
                                key: OPENAI_API_KEY
                      - name: OPENAI_BASE_URL
                        valueFrom:
                            configMapKeyRef:
                                name: hermes-gateway-config
                                key: OPENAI_BASE_URL
                      - name: OPENAI_MODEL
                        valueFrom:
                            configMapKeyRef:
                                name: hermes-gateway-config
                                key: OPENAI_MODEL
                      - name: SKALD_API_KEY
                        valueFrom:
                            secretKeyRef:
                                name: hermes-gateway-secrets
                                key: SKALD_API_KEY
                      - name: SKALD_PROJECT_ID
                        valueFrom:
                            secretKeyRef:
                                name: hermes-gateway-secrets
                                key: SKALD_PROJECT_ID
                      - name: SKALD_BASE_URL
                        valueFrom:
                            configMapKeyRef:
                                name: hermes-gateway-config
                                key: SKALD_BASE_URL
                      - name: DISCORD_ALLOW_ALL_USERS
                        valueFrom:
                            configMapKeyRef:
                                name: hermes-gateway-config
                                key: DISCORD_ALLOW_ALL_USERS
                      - name: DISCORD_ALLOWED_CHANNELS
                        valueFrom:
                            configMapKeyRef:
                                name: hermes-gateway-config
                                key: DISCORD_ALLOWED_CHANNELS
                      - name: DISCORD_HOME_CHANNEL
                        valueFrom:
                            configMapKeyRef:
                                name: hermes-gateway-config
                                key: DISCORD_HOME_CHANNEL
                      - name: DISCORD_HOME_CHANNEL_NAME
                        valueFrom:
                            configMapKeyRef:
                                name: hermes-gateway-config
                                key: DISCORD_HOME_CHANNEL_NAME
                      - name: GIT_CONFIG_COUNT
                        value: "1"
                      - name: GIT_CONFIG_KEY_0
                        value: safe.directory
                      - name: GIT_CONFIG_VALUE_0
                        value: /opt/sparrow-function-spec
                  resources:
                      requests:
                          cpu: '250m'
                          memory: '512Mi'
                      limits:
                          cpu: '1'
                          memory: '1Gi'
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: false
                      capabilities:
                          drop:
                              - ALL
                  volumeMounts:
                      - name: hermes-config
                        mountPath: /var/lib/hermes/config.yaml
                        subPath: config.yaml
                        readOnly: true
                      - name: hermes-config
                        mountPath: /var/lib/hermes/SOUL.md
                        subPath: SOUL.md
                        readOnly: true
                      - name: sparrow-function-spec
                        mountPath: /opt/sparrow-function-spec
            volumes:
                - name: hermes-config
                  configMap:
                      name: hermes-gateway-config
                      items:
                          - key: config.yaml
                            path: config.yaml
                          - key: SOUL.md
                            path: SOUL.md
                - name: sparrow-function-spec
                  emptyDir: {}
            restartPolicy: Always
            terminationGracePeriodSeconds: 30
