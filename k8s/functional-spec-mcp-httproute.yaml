apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: functional-spec-mcp
  namespace: skald
  labels:
    app: skald
    component: functional-spec-mcp
    environment: production
  annotations:
    external-dns.alpha.kubernetes.io/hostname: mcp.skald.sparrow.local
    external-dns.alpha.kubernetes.io/ttl: 30m
spec:
  parentRefs:
    - name: functional-spec-mcp-gateway
      sectionName: https
  hostnames:
    - mcp.skald.sparrow.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: functional-spec-mcp
          port: 8080
      timeouts:
        request: 120s
