apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: functional-spec-mcp-worker-162bbadb
  namespace: skald
  labels:
    app: skald
    component: functional-spec-mcp-worker
    environment: production
    revision: 162bbadb
spec:
  serviceName: functional-spec-mcp-worker-162bbadb
  replicas: 2
  podManagementPolicy: Parallel
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app: skald
      component: functional-spec-mcp-worker
      revision: 162bbadb
  template:
    metadata:
      labels:
        app: skald
        component: functional-spec-mcp-worker
        environment: production
        revision: 162bbadb
    spec:
      serviceAccountName: functional-spec-mcp
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull-secret
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: functional-spec-mcp-worker
          image: ghcr.io/jc01rho/sparrow-function-spec-mcp@sha256:162bbadbef150536a94c7968d15ef5ac88502ee765f1a79f87479a84cb48a981
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: functional-spec-mcp-worker-config-162bbadb
          env:
            - name: MCP_SESSION_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MCP_SESSION_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: functional-spec-mcp-session-routing
                  key: signing-secret
          lifecycle:
            preStop:
              httpGet:
                path: /drain
                port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
