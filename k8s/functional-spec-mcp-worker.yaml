apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: functional-spec-mcp-worker-fde0ef9e
  namespace: skald
  labels:
    app: skald
    component: functional-spec-mcp-worker
    environment: production
    revision: fde0ef9e
spec:
  serviceName: functional-spec-mcp-worker-fde0ef9e
  replicas: 2
  podManagementPolicy: Parallel
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app: skald
      component: functional-spec-mcp-worker
      revision: fde0ef9e
  template:
    metadata:
      labels:
        app: skald
        component: functional-spec-mcp-worker
        environment: production
        revision: fde0ef9e
    spec:
      serviceAccountName: functional-spec-mcp
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - ml.node.k8s.sparrow.local
                      - devsecops.sparrow.local
      imagePullSecrets:
        - name: ghcr-pull-secret
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: functional-spec-mcp-worker
          image: ghcr.io/jc01rho/sparrow-function-spec-mcp@sha256:fde0ef9e85d722efe607a777f37ba7e772f7149f89be54c98903ce0d73bf117f
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: functional-spec-mcp-worker-config-fde0ef9e
          env:
            - name: MCP_SESSION_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MCP_SESSION_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: functional-spec-mcp-session-routing
                  key: signing-secret
          lifecycle:
            preStop:
              httpGet:
                path: /drain
                port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
