apiVersion: v1
kind: ServiceAccount
metadata:
  name: functional-spec-mcp
  namespace: skald
  labels:
    app: skald
    component: functional-spec-mcp
    environment: production
automountServiceAccountToken: false
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: functional-spec-mcp-router
  namespace: skald
  labels:
    app: skald
    component: functional-spec-mcp
    environment: production
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: skald
      component: functional-spec-mcp-router
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: functional-spec-mcp-router
  namespace: skald
  labels:
    app: skald
    component: functional-spec-mcp
    environment: production
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: skald
      component: functional-spec-mcp-router
  template:
    metadata:
      annotations:
        skald.io/mcp-active-revision: "c7e78651"
      labels:
        app: skald
        component: functional-spec-mcp-router
        environment: production
    spec:
      serviceAccountName: functional-spec-mcp
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: functional-spec-mcp-router
          image: ghcr.io/jc01rho/sparrow-function-spec-mcp@sha256:c7e786517190e34e3cf82271a64c59917c02edc82c35836feb41cf8cea078c3e
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: functional-spec-mcp-router-config
          env:
            - name: MCP_SESSION_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: functional-spec-mcp-session-routing
                  key: signing-secret
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
          memory: 512Mi
