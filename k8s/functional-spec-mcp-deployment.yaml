apiVersion: v1
kind: ServiceAccount
metadata:
  name: functional-spec-mcp
  namespace: skald
  labels:
    app: skald
    component: functional-spec-mcp
    environment: production
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: functional-spec-mcp
  namespace: skald
  labels:
    app: skald
    component: functional-spec-mcp
    environment: production
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: skald
      component: functional-spec-mcp
  template:
    metadata:
      labels:
        app: skald
        component: functional-spec-mcp
        environment: production
    spec:
      serviceAccountName: functional-spec-mcp
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: functional-spec-mcp
          image: ghcr.io/jc01rho/sparrow-function-spec-mcp@sha256:c15d3cdfa5817ac900ea5994d61574191e3ce630f1ae97f5ee02b48d8705ee7f
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: functional-spec-mcp-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
