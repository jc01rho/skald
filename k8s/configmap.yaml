apiVersion: v1
kind: ConfigMap
metadata:
    name: skald-config
    namespace: skald
    labels:
        app: skald
        component: config
        environment: production
data:
    # Domain Configuration
    API_DOMAIN: 'api.skald.local'
    UI_DOMAIN: 'ui.skald.local'
    ACME_EMAIL: 'admin@skald.local'

    # Database Configuration
    POSTGRES_DB: 'skald2'
    POSTGRES_USER: 'postgres'
    DB_HOST: 'postgres-service'
    DB_PORT: '5432'

    # RabbitMQ Configuration
    RABBITMQ_HOST: 'rabbitmq-service'
    RABBITMQ_PORT: '5672'
    RABBITMQ_USER: 'skald'
    RABBITMQ_VHOST: '/'
    INTER_PROCESS_QUEUE: 'rabbitmq'

    # Redis Configuration
    REDIS_HOST: 'redis-service'
    REDIS_PORT: '6379'

    # Application Configuration
    IS_SELF_HOSTED_DEPLOY: 'true'
    LLM_PROVIDER: 'cli-proxy-api'
    CLI_PROXY_API_BASE_URL: 'http://***REMOVED***/v1'
    CLI_PROXY_BASE_URL: 'http://***REMOVED***/v1'
    GEMINI_API_BASE_URL: 'http://***REMOVED***/v1'
    LLM_DEFAULT_CHAT_MODEL: 'qwen-3.5'
    LLM_DEFAULT_CLASSIFICATION_MODEL: 'qwen-3.5'
    LLM_FALLBACK_CHAIN: 'qwen-3.5,deepseek-v3.2,glm-5,kimi,qwen3-235b,free,gemini-2.5-pro,gemini-3-flash-preview,qwen3-max-preview,qwen3-coder-plus,qwen3-235b-a22b-thinking-2507,qwen3-235b-a22b-instruct,qwen3-32b,deepseek-v3.2-reasoner,deepseek-v3.1,deepseek-v3,deepseek-r1,deepseek-v3.2-chat,giga-potato,sonnet'
    EMBEDDING_PROVIDER: 'external'
    DOCUMENT_EXTRACTION_PROVIDER: 'docling'
    EMBEDDING_SERVICE_URL: 'http://embedding-service:8000'
    DOCLING_SERVICE_URL: 'http://docling-service:5001'
    SECURE_SSL_REDIRECT: 'false'
    EXPRESS_SERVER_PORT: '8000'

    # Frontend Configuration
    FRONTEND_URL: 'https://ui.skald.local'
    API_URL: 'https://api.skald.local'

    # LangSmith Configuration (optional)
    LANGSMITH_TRACING: 'false'

    # Local Embedding Configuration
    LOCAL_EMBEDDING_MODEL: 'all-MiniLM-L6-v2'
    LOCAL_RERANK_MODEL: 'cross-encoder/ms-marco-MiniLM-L-6-v2'
    TARGET_DIMENSION: '2048'
    
    # Reranking Configuration
    RERANK_PROVIDER: 'ollama'
    
    # Logging Configuration
    LOG_LEVEL: 'info'
    
    # Query Language (optional)
    QUERY_LANGUAGE: 'ko'
    
    # External Embedding URL (optional)
    EXTERNAL_EMBEDDING_URL: 'http://192.168.150.37:8889/embeddings'
    
    # Internal Rerank URL (optional)
    INTERNAL_RERANK_URL: 'http://192.168.150.37:8889/v1/rerank'
