apiVersion: v1
kind: Service
metadata:
    name: skald-worker
    namespace: skald
    labels:
        app: skald
        component: worker
        environment: production
spec:
    type: ClusterIP
    ports:
        - name: http
          port: 8080
          targetPort: http
          protocol: TCP
    selector:
        app: skald
        component: worker
