apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: hermes-deploy-operator
    namespace: skald
    labels:
        app: skald
        component: hermes-deploy-operator
rules:
    - apiGroups:
          - coordination.k8s.io
      resources:
          - leases
      resourceNames:
          - skald-discord-deploy-operation
      verbs:
          - get
          - update
    - apiGroups:
          - apps
      resources:
          - deployments
      resourceNames:
          - discord-bot
          - hermes-gateway
      verbs:
          - get
          - patch
          - watch
    # Kubernetes does not enforce resourceNames for create. These create grants
    # are the minimum required for first cutover and immutable snapshot restore;
    # ordinary deploy deliberately has no delete/deletecollection, RBAC delegation,
    # impersonation, wildcard, or Lease create/delete/patch authority.
    - apiGroups:
          - apps
      resources:
          - deployments
      verbs:
          - create
    - apiGroups:
          - ""
      resources:
          - configmaps
      verbs:
          - get
          - create
    - apiGroups:
          - ""
      resources:
          - configmaps
      resourceNames:
          - skald-discord-owner-state
      verbs:
          - update
    - apiGroups:
          - ""
      resources:
          - configmaps
      resourceNames:
          - discord-bot-config
          - hermes-gateway-config
      verbs:
          - patch
    - apiGroups:
          - ""
      resources:
          - secrets
      resourceNames:
          - discord-bot-secrets
          - hermes-gateway-secrets
      verbs:
          - get
    - apiGroups:
          - ""
      resources:
          - services
      resourceNames:
          - discord-bot-service
      verbs:
          - get
          - patch
    - apiGroups:
          - ""
      resources:
          - services
      verbs:
          - create
    - apiGroups:
          - ""
      resources:
          - services/proxy
      resourceNames:
          - discord-bot-service
      verbs:
          - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: hermes-deploy-operator
    namespace: skald
    labels:
        app: skald
        component: hermes-deploy-operator
subjects:
    - kind: Group
      name: hermes-deploy-operators
      apiGroup: rbac.authorization.k8s.io
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: hermes-deploy-operator
